syntax = "proto3";

package blog.v1;

import "google/api/annotations.proto";

option go_package = "github.com/MucaSan/komitty-blog/backend/gen/blog/v1;blogv1";

// User is a blog author.
message User {
  string id = 1;
  string username = 2;
  // RFC 3339 timestamp.
  string created_at = 3;
  // is_prime marks the owner, who is allowed to create other accounts.
  bool is_prime = 4;
}

// Post is a single blog entry authored by a User.
message Post {
  string id = 1;
  string user_id = 2;
  // Denormalized author username so callers can render without a join.
  string username = 3;
  string title = 4;
  string content = 5;
  // RFC 3339 timestamp.
  string created_at = 6;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
}

message CreateUserResponse {
  User user = 1;
  // Session token to use as the Authorization bearer for CreatePost.
  string token = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  string token = 2;
}

message CreatePostRequest {
  string title = 1;
  string content = 2;
}

message CreatePostResponse {
  Post post = 1;
}

// UploadImageRequest uploads an image to be embedded in a post.
message UploadImageRequest {
  bytes data = 1;
  string content_type = 2;
}

message UploadImageResponse {
  string id = 1;
  // url is the relative path used to render the image, e.g. /v1/images/<id>.
  string url = 2;
}

message UpdatePostRequest {
  string id = 1;
  string title = 2;
  string content = 3;
}

message UpdatePostResponse {
  Post post = 1;
}

message DeletePostRequest {
  string id = 1;
}

message DeletePostResponse {}

message GetPostRequest {
  string id = 1;
}

message GetPostResponse {
  Post post = 1;
}

message ListPostsRequest {
  // page is 1-based. When 0 or omitted, the first page is returned.
  int32 page = 1;
}

message ListPostsResponse {
  repeated Post posts = 1;
  // total is the number of posts available across all pages.
  int32 total = 2;
  // page echoes the requested page (1-based).
  int32 page = 3;
  // total_pages is the number of available pages.
  int32 total_pages = 4;
}

message ListUserPostsRequest {
  string username = 1;
  // page is 1-based. When 0 or omitted, the first page is returned.
  int32 page = 2;
}

message ListUserPostsResponse {
  repeated Post posts = 1;
  // total is the number of posts by this user across all pages.
  int32 total = 2;
  // page echoes the requested page (1-based).
  int32 page = 3;
  // total_pages is the number of available pages.
  int32 total_pages = 4;
}

// Settings holds the visual preferences of a user. It is stored as a single
// JSONB document in the database (see the `settings` table), keyed by user id.
message Settings {
  // theme is "dark" (default) or "white".
  string theme = 1;
  // toolbar is "top" (default), "down" or "drag".
  string toolbar = 2;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  Settings settings = 1;
}

message UpdateSettingsRequest {
  Settings settings = 1;
}

message UpdateSettingsResponse {
  Settings settings = 1;
}

// Comment is a rich-text comment (or reply) attached to a post. The content is
// stored the same way as post content (a TipTap JSON document).
message Comment {
  string id = 1;
  string post_id = 2;
  string user_id = 3;
  // username is denormalized from the users table so callers can render without
  // a join.
  string username = 4;
  // parent_id is empty for top-level comments; otherwise it references the
  // comment being replied to.
  string parent_id = 5;
  string content = 6;
  // RFC 3339 timestamp.
  string created_at = 7;
}

message CreateCommentRequest {
  string post_id = 1;
  // parent_id is empty when the comment is a top-level comment.
  string parent_id = 2;
  string content = 3;
}

message CreateCommentResponse {
  Comment comment = 1;
}

message ListCommentsRequest {
  string post_id = 1;
}

message ListCommentsResponse {
  // comments is a flat list ordered oldest-first. The client reconstructs the
  // nested structure using parent_id.
  repeated Comment comments = 1;
}

message UpdateCommentRequest {
  string id = 1;
  string content = 2;
}

message UpdateCommentResponse {
  Comment comment = 1;
}

service BlogService {
  // CreateUser registers a new account.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }

  // Login authenticates an existing account.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/login"
      body: "*"
    };
  }

  // CreatePost publishes a new post (requires Authorization bearer token).
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse) {
    option (google.api.http) = {
      post: "/v1/posts"
      body: "*"
    };
  }

  // UploadImage stores an image and returns its public URL.
  rpc UploadImage(UploadImageRequest) returns (UploadImageResponse) {
    option (google.api.http) = {
      post: "/v1/images"
      body: "*"
    };
  }

  // UpdatePost edits a post. Only the post owner may update it.
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse) {
    option (google.api.http) = {
      patch: "/v1/posts/{id}"
      body: "*"
    };
  }

  // DeletePost removes a post. Only the post owner may delete it.
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse) {
    option (google.api.http) = {
      delete: "/v1/posts/{id}"
    };
  }

  // GetPost returns a single post by id. Post details are public, so this
  // endpoint does not require authentication.
  rpc GetPost(GetPostRequest) returns (GetPostResponse) {
    option (google.api.http) = {
      get: "/v1/posts/{id}"
    };
  }

  // ListPosts returns all posts, newest first.
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse) {
    option (google.api.http) = {
      get: "/v1/posts"
    };
  }

  // ListUserPosts returns the posts of a single user, newest first.
  rpc ListUserPosts(ListUserPostsRequest) returns (ListUserPostsResponse) {
    option (google.api.http) = {
      get: "/v1/users/{username}/posts"
    };
  }

  // GetSettings returns the authenticated user's visual settings. Defaults are
  // returned when the user has not saved any settings yet.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse) {
    option (google.api.http) = {
      get: "/v1/settings"
    };
  }

  // UpdateSettings saves the authenticated user's visual settings.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse) {
    option (google.api.http) = {
      post: "/v1/settings"
      body: "*"
    };
  }

  // CreateComment adds a comment (or a reply) to a post.
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse) {
    option (google.api.http) = {
      post: "/v1/posts/{post_id}/comments"
      body: "*"
    };
  }

  // ListComments returns all comments of a post, oldest first.
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse) {
    option (google.api.http) = {
      get: "/v1/posts/{post_id}/comments"
    };
  }

  // UpdateComment edits an existing comment. Only the author may edit it.
  rpc UpdateComment(UpdateCommentRequest) returns (UpdateCommentResponse) {
    option (google.api.http) = {
      patch: "/v1/comments/{id}"
      body: "*"
    };
  }
}
