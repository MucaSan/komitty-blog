services:
  db:
    image: postgres:16-alpine
    container_name: komitty-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: komitty
      POSTGRES_PASSWORD: komitty
      POSTGRES_DB: komitty
    ports:
      - "5432:5432"
    volumes:
      - komitty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komitty -d komitty"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional one-shot job: applies Atlas migrations against the db above.
  migrate:
    image: arigaio/atlas:latest
    container_name: komitty-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: >
      migrate apply
      --dir file:///migrations
      --url postgres://komitty:komitty@db:5432/komitty?sslmode=disable

volumes:
  komitty_pgdata:
